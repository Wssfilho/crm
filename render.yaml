databases:
  - name: crm-db
    plan: basic-256mb
    region: virginia
    databaseName: crm
    user: crm

services:
  - type: web
    name: crm-api
    runtime: node
    plan: starter
    region: virginia
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ALLOW_SIGN_UP
        value: 'true'
