services:
  postgres:
    container_name: postgres-crm-iniciais
    image: postgres
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: crm
      PGDATA: /data/postgres
    volumes:
      - ./data/postgres:/data/postgres

  adminer:
    container_name: adminer-crm-iniciais
    image: adminer
    ports:
      - 8080:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
